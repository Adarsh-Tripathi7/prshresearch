<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="icon.svg?v=4">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Offline | Prsh Capital</title>
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 24px; }
  .offline-icon { width: 64px; height: 64px; color: var(--accent); margin-bottom: 24px; opacity: 0.8; }
  h1 { font-size: 24px; margin-bottom: 12px; letter-spacing: -0.5px; }
  p { color: var(--text-2); font-size: 15px; max-width: 300px; margin-bottom: 32px; line-height: 1.5; }
  button { background: var(--bg-surface); color: var(--text-1); border: 1px solid var(--border); padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  button:hover { background: var(--bg-hover); border-color: var(--accent); }
</style>
<script>
(function(){
    var theme = localStorage.getItem("theme");
    if(theme === "light") {
        document.documentElement.setAttribute("data-theme", "light");
    }
})();
</script>
</head>
<body>

  <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 1l22 22"></path>
    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
    <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
    <line x1="12" y1="20" x2="12.01" y2="20"></line>
  </svg>
  
  <h1>You're Offline</h1>
  <p>Please check your internet connection and try again to view live dashboard data.</p>
  
  <button onclick="window.location.reload()">Try Again</button>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var toggleBtn = document.getElementById("themeToggleBtn");
    if(toggleBtn) {
        toggleBtn.addEventListener("click", function() {
            var isLight = document.documentElement.getAttribute("data-theme") === "light";
            if(isLight) {
                document.documentElement.removeAttribute("data-theme");
                localStorage.setItem("theme", "dark");
            } else {
                document.documentElement.setAttribute("data-theme", "light");
                localStorage.setItem("theme", "light");
            }
            if(window.echarts) {
                location.reload();
            }
        });
    }
});
</script>
</body>
</html>
