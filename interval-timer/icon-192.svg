<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Titanium Raw Dark Canvas -->
  <rect width="192" height="192" rx="44" fill="#0A0B0E"/>
  <defs>
    <!-- Brushed Titanium Gradient -->
    <linearGradient id="titaniumMetal192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="titaniumCore192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="titaniumGlow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Bezel -->
  <rect x="22" y="22" width="148" height="148" rx="36" fill="url(#titaniumCore192)" stroke="url(#titaniumMetal192)" stroke-width="2.5"/>
  
  <!-- Aerospace Shield -->
  <path d="M96 44L52 66V118L96 144L140 118V66L96 44Z" stroke="url(#titaniumMetal192)" stroke-width="6" stroke-linejoin="round" fill="none" opacity="0.95"/>
  
  <!-- Titanium Lightning Crest -->
  <path d="M96 62L70 96H98L90 128L122 92H94L96 62Z" fill="url(#titaniumMetal192)" filter="url(#titaniumGlow192)"/>
</svg>
