<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Titanium Raw Dark Canvas -->
  <rect width="512" height="512" rx="118" fill="#0A0B0E"/>
  <defs>
    <!-- Brushed Titanium Gradient -->
    <linearGradient id="titaniumMetal512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="titaniumCore512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="titaniumGlow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Bezel -->
  <rect x="58" y="58" width="396" height="396" rx="96" fill="url(#titaniumCore512)" stroke="url(#titaniumMetal512)" stroke-width="6"/>
  
  <!-- Aerospace Shield -->
  <path d="M256 118L138 176V315L256 384L374 315V176L256 118Z" stroke="url(#titaniumMetal512)" stroke-width="16" stroke-linejoin="round" fill="none" opacity="0.95"/>
  
  <!-- Titanium Lightning Crest -->
  <path d="M256 166L186 256H262L240 342L326 246H252L256 166Z" fill="url(#titaniumMetal512)" filter="url(#titaniumGlow512)"/>
</svg>
